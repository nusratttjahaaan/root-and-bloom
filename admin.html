<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Root & Bloom</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <a href="admin.html" class="logo">Root &amp; <span>Bloom</span></a>
      <nav class="side-nav">
        <a href="admin.html" class="active"><i class="bi bi-shield-check"></i> Admin</a>
      </nav>
      <a href="admin-login.html" class="signout"><i class="bi bi-box-arrow-left"></i> Sign out</a>
    </aside>

    <main class="main">
      <div class="page-head">
        <h1>Admin</h1>
        <button class="btn-outline-brand" id="addBtn"><i class="bi bi-plus-lg"></i> Add product</button>
      </div>

      <div class="admin-stats">
        <div class="a-stat"><div class="ico"><i class="bi bi-people"></i></div><small>Users</small><div class="num">1,248</div></div>
        <div class="a-stat"><div class="ico"><i class="bi bi-box-seam"></i></div><small>Products</small><div class="num" id="statProducts">86</div></div>
        <div class="a-stat"><div class="ico"><i class="bi bi-star"></i></div><small>Reviews</small><div class="num">324</div></div>
        <div class="a-stat"><div class="ico"><i class="bi bi-activity"></i></div><small>Activities</small><div class="num">4,890</div></div>
      </div>

      <div class="card-white">
        <div class="a-head">
          <h3>Products</h3>
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" id="adminSearch" placeholder="Search">
          </div>
        </div>
        <div class="a-table-wrap">
          <table class="a-table">
            <thead>
              <tr><th>Product</th><th>Category</th><th>Match use</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>


  <div class="modal-back" id="prodModal">
    <div class="modal-box">
      <div class="modal-top">
        <h3 id="modalTitle">Add product</h3>
        <button type="button" id="closeProd">&times;</button>
      </div>
      <form id="prodForm">
        <div class="fld-row">
          <div class="fld"><label>Product name</label><input type="text" id="aName" placeholder="Product name"></div>
          <div class="fld"><label>Brand</label><input type="text" id="aBrand" placeholder="Brand name"></div>
        </div>
        <div class="fld-row">
          <div class="fld">
            <label>Category</label>
            <select id="aCategory">
              <option>Shampoo</option><option>Conditioner</option><option>Mask</option>
              <option>Oil</option><option>Serum</option>
            </select>
          </div>
          <div class="fld"><label>Price</label><input type="number" id="aPrice" value="24" min="0"></div>
        </div>
        <div class="fld">
          <label>Recommendation reason</label>
          <input type="text" id="aReason" placeholder="Why this product is recommended">
        </div>
        <div class="upload-row">
          <div class="upload-box" id="preview"><i class="bi bi-box-seam"></i></div>
          <div class="fld">
            <label>Product image</label>
            <input type="file" id="aFile" accept="image/png, image/jpeg, image/webp">
            <small>PNG, JPG, or WebP. Maximum 5 MB.</small>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="cancel" id="cancelProd">Cancel</button>
          <button type="submit" class="btn-outline-brand" id="saveBtn">Add product</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-back" id="delModal">
    <div class="modal-box">
      <div class="modal-top">
        <h3>Delete product?</h3>
        <button type="button" id="closeDel">&times;</button>
      </div>
      <div class="danger-box">
        <i class="bi bi-exclamation-triangle"></i>
        <div>
          <b>This action cannot be undone.</b>
          <p><span id="delName"></span> will be removed from the product list.</p>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="cancelDel">Cancel</button>
        <button type="button" class="btn-danger-soft" id="delConfirm"><i class="bi bi-trash"></i> Delete product</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
