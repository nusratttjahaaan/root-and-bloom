<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Root & Bloom</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrap">

    <div class="auth-left">
      <a href="login.html" class="back">&larr; Back</a>

      <div class="auth-form">
        <a href="login.html" class="logo">Root &amp; <span>Bloom</span></a>
        <h1>Create your account</h1>
        <p class="sub">Start with a quick hair assessment.</p>

        <form>
          <div class="mb-3">
            <label>Full name</label>
            <input type="text" class="form-control" placeholder="Your name">
          </div>
          <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" placeholder="you@example.com">
          </div>
          <div class="mb-3">
            <label>Password</label>
            <input type="password" class="form-control" placeholder="At least 8 characters">
          </div>
          <div class="mb-4">
            <label>Confirm password</label>
            <input type="password" class="form-control" placeholder="Repeat password">
          </div>
          <button type="button" class="btn-brand" onclick="window.location.href='quiz.html'">Create account</button>
        </form>

        <div class="auth-links">
          <p>Already have an account? <a href="login.html">Log in</a></p>
        </div>
      </div>
    </div>

    <div class="auth-photo" style="background-image: url('images/login-hero.jpg');">
      <p>&ldquo;A calmer routine starts with understanding what your hair needs.&rdquo;</p>
    </div>

  </div>
</body>
</html>
