<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | Root & Bloom</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <a href="dashboard.html" class="logo">Root &amp; <span>Bloom</span></a>
      <nav class="side-nav">
        <a href="dashboard.html"><i class="bi bi-house"></i> Home</a>
        <a href="#"><i class="bi bi-calendar3"></i> Calendar</a>
        <a href="products.html" class="active"><i class="bi bi-bag"></i> Products</a>
        <a href="#"><i class="bi bi-graph-up-arrow"></i> Progress</a>
        <a href="#"><i class="bi bi-person-circle"></i> Profile</a>
        <a href="#"><i class="bi bi-book"></i> Tips</a>
        <a href="#"><i class="bi bi-heart-pulse"></i> Dermatologists</a>
      </nav>
      <div class="side-user">
        <img src="images/avatar.jpg" alt="User">
        <div><b>Nusrat Maysha</b><small>Curly &middot; Dry scalp</small></div>
      </div>
    </aside>

    <main class="main">
      <div class="page-head"><h1>Products</h1></div>

      <div class="toolbar">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" id="searchInput" placeholder="Search products">
        </div>
        <select class="sort-select" id="sortSelect">
          <option value="match">Recommended</option>
          <option value="rating">Top rated</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
        </select>
      </div>

      <div class="filter-row">
        <button class="filter-chip active" data-cat="All">All</button>
        <button class="filter-chip" data-cat="Shampoo">Shampoo</button>
        <button class="filter-chip" data-cat="Conditioner">Conditioner</button>
        <button class="filter-chip" data-cat="Mask">Mask</button>
        <button class="filter-chip" data-cat="Oil">Oil</button>
        <button class="filter-chip" data-cat="Serum">Serum</button>
      </div>

      <div class="count-row">
        <span id="countText">6 products</span>
        <button class="safe-toggle" id="safeBtn"><i class="bi bi-shield-check"></i> Sensitivity-safe</button>
      </div>

      <div class="prod-grid" id="grid"></div>
      <p class="no-results" id="noResults">No products match your search.</p>
    </main>
  </div>

  <div class="detail-overlay" id="overlay">
    <div class="detail-panel" id="panel"></div>
  </div>

  <script src="js/products.js"></script>
</body>
</html>
