<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in | Root & Bloom</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="admin-auth">
    <div class="admin-box auth-form">
      <a href="login.html" class="admin-back">Back to user login</a>

      <a href="index.html" class="logo">Root &amp; <span>Bloom</span></a>
      <h1>Admin sign in</h1>
      <p class="sub">Access the Root &amp; Bloom administration panel.</p>

      <form>
        <div class="mb-3">
          <label>Admin email</label>
          <input type="email" class="form-control" placeholder="admin@example.com">
        </div>
        <div class="mb-4">
          <label>Password</label>
          <input type="password" class="form-control" placeholder="Enter your password">
        </div>
        <button type="button" class="btn-brand" onclick="window.location.href='admin.html'">Sign in to admin</button>
      </form>
    </div>
  </div>
</body>
</html>
