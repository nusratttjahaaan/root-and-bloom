<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hair quiz | Root & Bloom</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="quiz-page">

    <header class="quiz-top">
      <a href="login.html" class="logo">Root &amp; <span>Bloom</span></a>
      <a href="dashboard.html" class="exit">Save &amp; exit</a>
    </header>

    <main class="quiz-body">
      <div class="step-row">
        <span id="stepText">Step 1 of 10</span>
        <div class="step-track"><div class="step-fill" id="stepFill"></div></div>
      </div>

      <h1 class="quiz-q" id="qTitle"></h1>
      <p class="quiz-hint" id="qHint"></p>

      <div class="options" id="options"></div>

      <div class="other-box" id="otherBox">
        <label>Your answer</label>
        <input type="text" id="otherInput" placeholder="e.g. coconut oil">
      </div>

      <div class="quiz-nav">
        <button type="button" class="btn-back" id="backBtn">&larr; Back</button>
        <button type="button" class="btn-next" id="nextBtn">Continue &rarr;</button>
      </div>
    </main>

    <p class="quiz-foot">Hair-care guidance only. This is not a medical diagnosis.</p>
  </div>

  <script src="js/quiz.js"></script>
</body>
</html>
