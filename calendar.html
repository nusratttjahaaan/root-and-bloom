<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar | Root & Bloom</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <a href="dashboard.html" class="logo">Root &amp; <span>Bloom</span></a>
      <nav class="side-nav">
        <a href="dashboard.html"><i class="bi bi-house"></i> Home</a>
        <a href="calendar.html" class="active"><i class="bi bi-calendar3"></i> Calendar</a>
        <a href="products.html"><i class="bi bi-bag"></i> Products</a>
        <a href="progress.html"><i class="bi bi-graph-up-arrow"></i> Progress</a>
        <a href="#"><i class="bi bi-person-circle"></i> Profile</a>
        <a href="#"><i class="bi bi-book"></i> Tips</a>
        <a href="#"><i class="bi bi-heart-pulse"></i> Dermatologists</a>
      </nav>
      <div class="side-user">
        <img src="images/avatar.jpg" alt="User">
        <div><b>Nusrat Maysha</b><small>Curly &middot; Dry scalp</small></div>
      </div>
    </aside>

    <main class="main">
      <div class="page-head">
        <h1>Calendar</h1>
        <button class="btn-outline-brand" id="openModalTop"><i class="bi bi-plus-lg"></i> Add activity</button>
      </div>

      <div class="cal-layout">

        <div class="cal-card">
          <div class="cal-head">
            <div>
              <h3 id="calTitle">May 2026</h3>
              <small id="calCount">4 activities this month</small>
            </div>
            <div class="cal-arrows">
              <button id="prevBtn"><i class="bi bi-arrow-left"></i></button>
              <button id="nextBtn"><i class="bi bi-arrow-right"></i></button>
            </div>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-legend"><span>Completed</span><span class="up">Upcoming</span></div>
        </div>

        <div>
          <div class="day-head">
            <div>
              <small>Selected day</small>
              <h3 id="dayDate">May 14</h3>
            </div>
            <span class="day-pill" id="dayName">Thursday</span>
          </div>
          <div id="dayList"></div>
          <button class="add-day" id="openModalDay"><i class="bi bi-plus-lg"></i> Add to this day</button>
        </div>

      </div>
    </main>
  </div>

  <!-- Add activity popup -->
  <div class="modal-back" id="modal">
    <div class="modal-box">
      <div class="modal-top">
        <h3>Add activity</h3>
        <button type="button" id="closeX">&times;</button>
      </div>
      <form id="addForm">
        <div class="fld">
          <label>Activity</label>
          <select id="fActivity">
            <option>Hair mask</option>
            <option>Hair wash</option>
            <option>Conditioning</option>
            <option>Scalp oil</option>
            <option>Scalp massage</option>
          </select>
        </div>
        <div class="fld-row">
          <div class="fld"><label>Date</label><input type="date" id="fDate" required></div>
          <div class="fld"><label>Time</label><input type="time" id="fTime"></div>
        </div>
        <div class="fld">
          <label>Notes</label>
          <input type="text" id="fNotes" placeholder="Optional note">
        </div>
        <div class="modal-actions">
          <button type="button" class="cancel" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-outline-brand">Add activity</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/calendar.js"></script>
</body>
</html>
